    datatype: radio
    choices:
      - Phone
      - Email
      - Mail
---
mandatory: fileAppeal
code: |
  appraisal_value = 0
  if had_appraisal == True:
    appraisal_document = None
    appraisal_value = None
  if_prefers_email = contact_preference == "Phone"
  if_prefers_phone = contact_preference == "Email"
  if_prefers_usmail = True if contact_preference not in ["Phone", "Email", "Mail"] else contact_preference == "Mail"
---
mandatory: fileAppeal
question: |
  Appraisal
subquestion: |
  Generally, an appraisal is a strong basis for an appeal. If you have a recent appraisal showing a lower home value than the City's assessment, you can appeal on that basis alone, and there is no need for you to answer any other questions. However, if you would like to answer other questions, you may do so.
fields:
  - "Did you have an appraisal within the past 3 years showing a home value lower than the assessed value?": had_appraisal
    datatype: yesnoradio
  - Please upload a picture of your appraisal.: appraisal_document
    datatype: file
    show if: had_appraisal
  - What was the appraisal amount?: appraisal_value
    show if: had_appraisal
---
mandatory: fileAppeal
continue button field: continuing
question: |
  Property Characteristics
subquestion: |
  The City uses certain information about your property’s characteristics to determine its market value.  Some of those characteristics are listed below. If any of them are incorrect, this may be a reason the City should lower your tax assessment.  However, it also may be a reason for the City to increase your assessment.  For example, if the City’s records show that your home has three bedrooms, and it actually has five bedrooms, that may increase.

  This is information from your last assessment. Please verify whether any of the following attributes are incorrect.

  * Square Footage of the Lot:  ${ home_data['total_area'] if  home_data['total_area'] is not None else "Not Available"}
  * Square Footage of the Home: ${ home_data['total_livable_area'] if  home_data['total_livable_area'] is not None else "Not Available" }
  * Number of Rooms: ${ home_data['number_of_rooms'] if home_data['number_of_rooms'] is not None else "Not Available"}
  * Number of Stories:  ${ home_data['number_stories'] if home_data['number_stories'] is not None else "Not Available" }
  * Fireplaces: ${ home_data['fireplaces'] if home_data['fireplaces'] is not None else "Not Available"}
  * Central Air: ${ "Yes" if home_data["central_air"] == "Y" else "No"}

  If any are incorrect, please explain in the space why your home may differ in the characteristics here.
fields:
- Explanation: explain_property_chars
  datatype: area
  required: false
---
mandatory: fileAppeal
continue button field: continuing
question: |
  Condition Code
subquestion: |
  The City has determined that your home is ${condition_code}.  This “condition code” has an effect on your assessment.  For example, an otherwise identical home in “below average” condition will have a lower tax assessment than a home in “average” condition.  

  ## Description

  ${condition_code_description}
  

  Does this condition type look correct?

noyes: condition_correct
---
terms:
  Above Average: |
    A well-maintained home with newer features such as floors, windows,and doors.  Not a new build or complete/recent rehab.
  Average: |
    This is the condition of most homes in Philadelphia.  Use this if your home is in need of some minor maintenance, but is generally livable and well-maintained.
  Below Average: |
    Use this condition code if your home is in need of major repairs, or has serious defects (fallen-in ceilings, sagging porch, cracking walls).  This condition code is also usually the right one to use if a tree has fallen onto your home and caused minor to moderate damage.
  Poor: |
    Use this if your property is in poor enough condition that it is in need of a complete rehabilitation.  This category often includes homes that are unsafe to live in (buckling walls, missing roof pieces, etc.)  Use this condition code if a tree has fallen onto your home and caused major damage.
  Sealed/Structurally Unsound: |
    Use this condition code of your property is a shell and needs to be demolished.
---
mandatory: fileAppeal
code: |
  if condition_correct == True:
    condition_description
    condition_code_doc
---
continue button field: continuing
question: |
  Revise Condition Code
subquestion: |
  You should submit photographs or other records to support your claim.

  Put any other information about why you think your property has been given the wrong condition code.  Write one or two sentences (for example, “A tree fell onto my home, and the roof is damaged and covered with a tarp.” or “A water leak caused serious damage to my ceiling and floors, which need extensive repairs.”) 

  * New Construction (1)
  * Rehab (2)
  * Above Average (3)
  * Average (4)
  * Below Average (5)
  * Poor (6)
  * Sealed/Structurally Unsound (7):   

fields:
  - New Condition Code: actual_condition_code
    input type: radio
    choices:
      - 1 New Construction
      - 2 Rehab
      - 3 Above Average
      - 4 Average
      - 5 Below Average
      - 6 Poor
      - 7 Sealed / Structurally Unsound
  - Please describe why your property should be assessed with this condition code: condition_description
    input type: area
  - Please upload a document to support your claim for a new condition code: condition_code_doc
    datatype: file
    required: false
---
mandatory: fileAppeal
continue button field: continuing
question: |
  Market Analysis Question
subquestion: |
  Have any of your neighbors recently sold similar properties to yours for less than your assessed value?  You can either ask your neighbors, or look on websites like [Zillow](https://www.zillow.com/?msockid=135c0f2f9d8a65b721ca1c0d9c486406) to browse recent sales.  Try to find properties within three blocks of yours that are similar in size and condition, and have sold within the past two years.

  Did you find one or more comparable recent sales?
  
yesno: market_analysis
---
mandatory: fileAppeal
code: |
  if market_analysis == True:
    market_value
    address_mv_example
---
continue button field: continuing
question: |
  Market Analysis Question
fields:
  - What market values did you see for this property?: market_value
    input type: text
  - Please list an example of an address with this property value: address_mv_example
    input type: text
---
mandatory: fileAppeal
continue button field: continuing
question: |
  Catchall
subquestion: |
  Is there any other reason you think the City should lower your property value?  If so, list it here and propose a new valuation. 
  
  Remember that it is not a valid basis for an appeal to say that you are not happy with how the City is using your taxes, or that you are not getting enough services for your taxes.  It is also not a valid basis for an appeal to say that your tax assessment has gone up too much since last year.  Your appeal must state a reason that your assessment is inaccurate
fields:
  - I believe my property is incorrectly assessed because: incorrect_assessment_rationale
    input type: area
    required: false
  - I believe my property is worth: proposed_value
    input type: text
    required: false
    default: ${appraisal_value}
---
terms:
  oral hearing: |
    Oral hearings generally occur on Zoom, but you have the option of attending the hearing in person.  You will have the opportunity to state your reasons for appeal and submit evidence.  It may be several months or more than a year before you are scheduled for a hearing.
  non-oral hearing: |
    If you choose a non-oral hearing, the Board of Revision of Taxes will review your submission and issue a decision in writing.
---
mandatory: fileAppeal
continue button field: continuing
question: |
  Hearing Question
subquestion: |
  The Board of Revision of Taxes gives you the option of having an {oral hearing} or a {non-oral hearing} for your appeal. 
  
  Which would you like?

fields:
  - Which would you like?: hearing_type
    input type: radio
    choices:
      - Oral Hearing
      - Non-Oral Hearing

---
code: |
  prefers_oralhearing=hearing_type == "Oral Hearing"
  prefers_nonoral=hearing_type == "Non-Oral Hearing"
          
