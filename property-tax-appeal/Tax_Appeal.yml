  - Owner Name 2: ownername_2
    default: |
      ${ home_data['owner_2'].title() }
  - Property Address: propertyaddress_1
    default: |
      ${ home_data['propertyaddress_1'] }
  - Property City: property_city
    default: |
      Philadelphia
  - Property City State: property_state
    default: |
      PA
  - Property Zip Code: property_zipcode
    default: |
      ${ home_data['zip_code'] }
  - Phone Number: phone_number
  - OPA Account No.: opa_accountno
    default: |
