subject: Tax Appeal
content: |
  Hello,
  
  Here's the form you completed on Community Legal Services' web page, which compiles information related to your tax assessment appeal.
---
code: |
  template_vals = {
       "mailing_1": mailing_1,
       "mailing_city": mailing_city,
       "mailing_state": mailing_state,
       "mailing_zipcode": mailing_zipcode,
       "ownername_1": ownername_1,
       "ownername_2": ownername_2,
       "propertyaddress_1": propertyaddress_1,
       "property_city": property_city,
       "property_state": property_state,
       "property_zipcode": property_zipcode,
       "phone_number": phone_number,
